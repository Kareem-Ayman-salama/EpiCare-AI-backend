services:
  - type: web
    name: epicare-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/src/EpiCare.Api/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: AiModel__BaseUrl
        value: https://web-production-bad93.up.railway.app
      - key: AiModel__PredictPath
        value: /predict
      - key: AiModel__WindowSize
        value: 240
      - key: AiModel__ModelWindowCount
        value: 8
      - key: AiModel__ModelSamplesPerWindow
        value: 3840
      - key: AiModel__ModelEegChannels
        value: 2
      - key: AiModel__ModelEcgChannels
        value: 1
      - key: AiModel__ModelEmgChannels
        value: 1
      - key: AiModel__HighRiskThreshold
        value: 0.7
